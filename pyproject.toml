[project]
name = "iagent"
version = "0.1.0"
description = "Local AI coach for learning tracks in iRacing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.7.22",
    "click>=8.1",
    "numpy>=2.0",
    "pandas>=2.3.1",
    "pyarrow>=17",
    "pyirsdk>=1.3.5",
]

[dependency-groups]
dev = [
    "black[d]>=25.1.0",
    "pytest>=8.4.1",
    "pandas-stubs~=2.3.1",
]

[project.scripts]
iagent = "iagent.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["iagent*"]

[tool.uv]
package = true

