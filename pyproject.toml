[project]
name = "iagent"
version = "0.1.0"
description = ""
authors = [
    {name = "Vedant Varshney",email = "vedwork1@gmail.com"}
]
readme = "README.rst"
# partler-tts has a dependency sentence-piece which does not support >3.13.0
requires-python = ">=3.12.4,<3.13.0"
dependencies = [
    "pyirsdk (>=1.3.5,<2.0.0)",
    "langchain (>=0.3.25,<0.4.0)",
    "ollama (>=0.4.8,<0.5.0)",
    "langchain-ollama (>=0.3.2,<0.4.0)",
    "langgraph (>=0.4.1,<0.5.0)",
    "sentence-transformers (>=4.1.0,<5.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "sqlalchemy (>=2.0.40,<3.0.0)",
    "psycopg2 (>=2.9.10,<3.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "sounddevice (>=0.5.1,<0.6.0)",
    "nari-tts @ git+https://github.com/nari-labs/dia.git",
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
black = "^25.1.0"
jupyterlab = "^4.4.2"
ipywidgets = "^8.1.7"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
