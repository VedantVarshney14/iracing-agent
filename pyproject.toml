[project]
name = "iagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.10.5",
    "kokoro>=0.9.4",
    "langchain>=0.3.26",
    "langchain-mcp-adapters>=0.1.9",
    "langchain-ollama>=0.3.5",
    "langfuse>=3.2.5",
    "langgraph>=0.5.3",
    "matplotlib>=3.10.3",
    "ollama>=0.5.1",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "pyirsdk>=1.3.5",
    "pytest-asyncio>=1.1.0",
    "pytz>=2025.2",
    "sentence-transformers>=5.0.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.41",
]

[dependency-groups]
dev = [
    "black[d]>=25.1.0",
    "jupyterlab>=4.4.5",
    "pip>=25.2",
    "pytest>=8.4.1",
    "pandas-stubs~=2.3.1",
]

[tool.setuptools]
packages = ["iagent"]

[tool.uv]
package = true

