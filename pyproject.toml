[project]
name = "iagent"
version = "0.1.0"
description = "Local AI coach for learning tracks in iRacing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "kokoro>=0.9.4",
    "matplotlib>=3.10.3",
    "numpy>=2.0",
    "pandas>=2.3.1",
    "pyarrow>=17",
    "pydantic>=2.11.7",
    "pyirsdk>=1.3.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sounddevice>=0.5.2",
    "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
    "black[d]>=25.1.0",
    "jupyterlab>=4.4.5",
    "pip>=25.2",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pandas-stubs~=2.3.1",
]

[project.scripts]
iagent = "iagent.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["iagent*"]

[tool.uv]
package = true

